# dsh-novel-solo: web profile bundle patch layer.
# When this package is installed into a profile via `dsh plugin add`, this patch
# is applied as a layer, inserting the plugin row into the composed web
# configuration. The plugin registers an "agent-count" item inside the General
# settings section and persists it to ~/.dsh/.dsh-novel-solo-data/.
- insert:
    - id: dsh-novel-solo
      name: 'dsh-novel-solo'