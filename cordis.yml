# dsh-novel-solo: dev patch overlay for the web profile.
#
# Usage:
#   dsh web --patch ./cordis.yml          # 只要子 agent 数量卡片（左侧栏「插件」页）
#   dsh web --patch ./cordis.patch.yml    # 卡片 + novel-solo 预设（安装态走这条）
#
# 本文件只插 node 半区这一行，不带 novel-solo 预设声明行，所以宿主上不会出现
# 预设。需要预设请用 cordis.patch.yml。
- insert:
    - id: dsh-novel-solo
      name: 'dsh-novel-solo'
